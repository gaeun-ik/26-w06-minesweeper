<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f7f2" />
    <title>지뢰찾기</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="game">
      <header class="game__header">
        <div>
          <p class="eyebrow">CLASSIC GAME</p>
          <h1>지뢰찾기<span aria-hidden="true">.</span></h1>
          <p class="subtitle">조심스럽게 칸을 열어 모든 지뢰를 찾아보세요.</p>
        </div>
        <div class="game__badge" aria-hidden="true">💣 <span>9 × 9</span></div>
      </header>

      <section class="game__panel" aria-label="지뢰찾기 게임">
        <div class="game__toolbar">
          <div class="counter" aria-label="남은 지뢰 수">
            <span class="counter__icon" aria-hidden="true">⚑</span>
            <span class="counter__label">MINES</span>
            <output class="counter__value" id="mine-counter" aria-live="polite">010</output>
          </div>
          <button class="reset-button" id="reset-button" type="button" aria-label="새 게임 시작">
            <span id="reset-face" aria-hidden="true">🙂</span>
          </button>
          <div class="counter counter--timer" aria-label="경과 시간">
            <span class="counter__icon" aria-hidden="true">◷</span>
            <span class="counter__label">TIME</span>
            <output class="counter__value" id="timer" aria-live="off">000</output>
          </div>
        </div>

        <div class="board-frame">
          <div
            class="board"
            id="board"
            role="grid"
            aria-label="9행 9열 지뢰찾기 보드"
            aria-describedby="game-status"
          ></div>
        </div>

        <div class="game__footer">
          <p class="game-status" id="game-status" aria-live="polite">칸을 열어 게임을 시작하세요.</p>
          <p class="game-hint"><span aria-hidden="true">🖱️</span> 좌클릭: 열기 <span class="hint-divider">·</span> 우클릭: 깃발</p>
        </div>
      </section>
      <p class="page-note">천천히 살펴보세요. 숫자는 주변 지뢰의 개수입니다.</p>
    </main>
  </body>
</html>
